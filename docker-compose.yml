services:
  db:
    image: postgres:18
    container_name: project_alpha_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./alpha-api
    container_name: project_alpha_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./alpha-api:/app
    depends_on:
      - db

  fe:
    build:
      context: ./alpha-fe
    container_name: project_alpha_fe
    restart: unless-stopped
    environment:
      - API_TARGET=http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./alpha-fe:/app
      - fe_node_modules:/app/node_modules
      - fe_next:/app/.next
    depends_on:
      - api

volumes:
  pgdata:
  fe_node_modules:
  fe_next:
