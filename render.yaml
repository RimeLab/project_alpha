services:
  - type: web
    name: alpha-api
    env: docker
    rootDir: alpha-api
    dockerfilePath: ./Dockerfile.prod
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false  # Neon connection string (postgresql+asyncpg://...) — set in Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Render URL of alpha-fe, e.g. https://alpha-fe.onrender.com

  - type: web
    name: alpha-fe
    env: static
    rootDir: alpha-fe
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Render URL of alpha-api, e.g. https://alpha-api.onrender.com
