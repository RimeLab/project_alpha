services:
  - type: web
    name: alpha-api
    env: docker
    rootDir: alpha-api
    dockerfilePath: ./Dockerfile.prod
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false  # Neon connection string (postgresql+asyncpg://...) — set in Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Vercel URL of alpha-fe, e.g. https://alpha-fe.vercel.app
